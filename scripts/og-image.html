<!doctype html>
<!--
  Source of public/og-image.png (the link-preview image, 1200×630).
  Not part of the site build. To regenerate after a title change:

    chrome-headless-shell --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=5000 --screenshot=public/og-image.png scripts/og-image.html
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=block" />
<style>
  :root { --bg: #120f0b; --panel: #1b1611; --panel-2: #231c15; --line: #3a2f23; --fg: #eadcc4; --dim: #9a8870; --amber: #ffb547; --ok: #93c98c; --warn: #e8905e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "IBM Plex Mono", monospace; color: var(--fg); font-variant-ligatures: none;
    background:
      radial-gradient(900px 480px at 15% -5%, rgba(255, 181, 71, 0.12), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0 1px, transparent 1px 3px),
      var(--bg);
    padding: 48px 56px;
  }
  .term { height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--panel-2); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 20px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .bar .path { flex: 1; text-align: center; margin-right: 70px; }
  .body { flex: 1; padding: 30px 44px 34px; display: flex; flex-direction: column; }
  .label { color: var(--amber); font-size: 22px; letter-spacing: 0.08em; margin: 0 0 4px; }
  .name { font-family: "VT323", monospace; font-size: 112px; line-height: 0.95; color: var(--amber); text-shadow: 0 0 26px rgba(255, 181, 71, 0.4); margin: 0 0 14px; }
  .role { font-size: 34px; font-weight: 600; margin: 0 0 2px; }
  .stack { font-size: 28px; color: var(--fg); margin: 0 0 22px; }
  .pitch { font-size: 28px; color: var(--ok); margin: 0; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 22px; }
  .foot .url { color: var(--amber); font-weight: 600; }
  .led { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); margin-right: 10px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <span class="dot" style="background: var(--warn)"></span>
      <span class="dot" style="background: var(--amber)"></span>
      <span class="dot" style="background: var(--ok)"></span>
      <span class="path">guest@redcrach: ~</span>
    </div>
    <div class="body">
      <p class="label">&gt; whoami_</p>
      <p class="name">Taibouni Abdel Hafid</p>
      <p class="role">Senior Backend Engineer</p>
      <p class="stack">PHP, Laravel &amp; JavaScript · Ex-CTO</p>
      <p class="pitch">I turn slow legacy systems into fast, safe ones.</p>
      <div class="foot">
        <span><span class="led"></span>Algiers, Algeria · Remote, EU hours (UTC+1)</span>
        <span class="url">taibouni.dev</span>
      </div>
    </div>
  </div>
</body>
</html>
